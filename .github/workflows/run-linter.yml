# Keywords ordered by appearance in the GitHub Actions syntax documentation:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: "Run NorCal SKA Events linter"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run-linter:
    name: "Run linter"
    uses: ./.github/workflows/run-check.yml
    with:
      target: lint
